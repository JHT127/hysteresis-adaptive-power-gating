<svg width="900" height="930" viewBox="0 0 680 690" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Title -->
<text x="340" y="14" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Diagram 1 — Architecture</text>

<!-- PD_ALU container -->
<rect x="240" y="34" width="400" height="136" rx="20" fill="#f2f2f2" stroke="#000000" stroke-width="1" stroke-dasharray="6,4"/>
<text x="260" y="56" font-size="14" font-weight="bold" fill="#000000">PD_ALU — power-gated</text>

<!-- PD_TOP container -->
<rect x="40" y="410" width="600" height="220" rx="20" fill="#f2f2f2" stroke="#000000" stroke-width="1" stroke-dasharray="6,4"/>
<text x="60" y="436" font-size="14" font-weight="bold" fill="#000000">PD_TOP — always-on control domain</text>

<!-- Workload box -->
<rect x="40" y="40" width="160" height="56" rx="8" fill="#d9d9d9" stroke="#000000" stroke-width="1.5"/>
<text x="120" y="62" text-anchor="middle" font-size="14" fill="#000000">Workload</text>
<text x="120" y="80" text-anchor="middle" font-size="12" fill="#000000">req, op, a, b</text>

<!-- ALU box -->
<rect x="270" y="90" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="350" y="112" text-anchor="middle" font-size="14" fill="#000000">32-bit ALU</text>
<text x="350" y="130" text-anchor="middle" font-size="12" fill="#000000">9 ALU operations</text>

<!-- Footer switch box -->
<rect x="450" y="90" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="530" y="112" text-anchor="middle" font-size="14" fill="#000000">Footer switch</text>
<text x="530" y="130" text-anchor="middle" font-size="12" fill="#000000">MTCMOS footer bias</text>

<!-- Isolation ctrl box -->
<rect x="250" y="240" width="200" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="350" y="262" text-anchor="middle" font-size="14" fill="#000000">Isolation ctrl</text>
<text x="350" y="280" text-anchor="middle" font-size="12" fill="#000000">clamps result, valid</text>

<!-- ALU output box -->
<rect x="250" y="330" width="200" height="56" rx="8" fill="#d9d9d9" stroke="#000000" stroke-width="1.5"/>
<text x="350" y="352" text-anchor="middle" font-size="14" fill="#000000">ALU output</text>
<text x="350" y="370" text-anchor="middle" font-size="12" fill="#000000">result, valid (isolated)</text>

<!-- Hysteresis predictor box -->
<rect x="70" y="470" width="260" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="200" y="492" text-anchor="middle" font-size="14" fill="#000000">Hysteresis predictor</text>
<text x="200" y="510" text-anchor="middle" font-size="12" fill="#000000">dual-condition adaptive gate</text>

<!-- Activity monitor box -->
<rect x="350" y="470" width="260" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="480" y="492" text-anchor="middle" font-size="14" fill="#000000">Activity monitor</text>
<text x="480" y="510" text-anchor="middle" font-size="12" fill="#000000">16-cycle rolling popcount</text>

<!-- Power state FSM box -->
<rect x="70" y="546" width="260" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="200" y="568" text-anchor="middle" font-size="14" fill="#000000">Power state FSM</text>
<text x="200" y="586" text-anchor="middle" font-size="12" fill="#000000">7 states, wake-up timers</text>

<!-- Sleep controller box -->
<rect x="350" y="546" width="260" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="480" y="568" text-anchor="middle" font-size="14" fill="#000000">Sleep controller</text>
<text x="480" y="586" text-anchor="middle" font-size="12" fill="#000000">footer bias + rush current</text>

<!-- Solid data-path arrows -->
<line x1="200" y1="68" x2="270" y2="118" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M350,146 L350,240" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M350,296 L350,330" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="498" x2="330" y2="498" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="526" x2="200" y2="546" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="574" x2="350" y2="574" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Dashed feedback / control arrows: arrowhead ONLY at the destination end -->
<!-- ALU (alu_active, source, no arrowhead) -> Activity monitor (destination, arrowhead) -->
<path d="M350,90 L350,26 L635,26 L635,498 L610,498" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

<!-- Power state FSM (iso_en, source, no arrowhead) -> Isolation ctrl (destination, arrowhead) -->
<path d="M70,574 L20,574 L20,268 L250,268" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

<!-- Sleep controller (footer_sel/rush_ctrl, source, no arrowhead) -> Footer switch (destination, arrowhead) -->
<path d="M610,574 L625,574 L625,146 L530,146" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

</svg>
