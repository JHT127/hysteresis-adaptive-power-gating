<svg width="900" height="650" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Title -->
<text x="340" y="14" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Diagram 2 — Power State FSM (7 states)</text>

<!-- Outer frame -->
<rect x="10" y="22" width="660" height="410" fill="none" stroke="#000000" stroke-width="1.2"/>

<!-- rst entry stub -->
<line x1="340" y1="28" x2="340" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="346" y="46" font-size="12" fill="#000000">rst</text>

<!-- S_ON -->
<rect x="250" y="60" width="180" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#000000">S_ON</text>
<text x="340" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000000">normal operation</text>

<!-- S_TO_LS -->
<rect x="140" y="160" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="220" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#000000">S_TO_LS</text>
<text x="220" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000000">ramp to LS</text>

<!-- S_TO_DS -->
<rect x="380" y="160" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="460" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#000000">S_TO_DS</text>
<text x="460" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000000">ramp to DS</text>

<!-- S_LIGHT_SLEEP -->
<rect x="140" y="260" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="220" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#000000">S_LIGHT_SLEEP</text>
<text x="220" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000000">state-retentive</text>

<!-- S_DEEP_SLEEP -->
<rect x="380" y="260" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="460" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#000000">S_DEEP_SLEEP</text>
<text x="460" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000000">non-retentive</text>

<!-- S_WAKEUP_LS -->
<rect x="140" y="360" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="220" y="380" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#000000">S_WAKEUP_LS</text>
<text x="220" y="398" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000000">3-cycle delay</text>

<!-- S_WAKEUP_DS -->
<rect x="380" y="360" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="460" y="380" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#000000">S_WAKEUP_DS</text>
<text x="460" y="398" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000000">8-cycle delay</text>

<!-- S_ON -> S_TO_LS -->
<path d="M300,116 L300,138 L220,138 L220,160" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="225" y="133" font-size="12" fill="#000000">sleep_req=LS</text>

<!-- S_ON -> S_TO_DS -->
<path d="M380,116 L380,138 L460,138 L460,160" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="133" font-size="12" fill="#000000">sleep_req=DS</text>

<!-- S_TO_LS -> S_LIGHT_SLEEP -->
<line x1="220" y1="216" x2="220" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="226" y="242" font-size="12" fill="#000000">always</text>

<!-- S_TO_DS -> S_DEEP_SLEEP -->
<line x1="460" y1="216" x2="460" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="466" y="242" font-size="12" fill="#000000">always</text>

<!-- S_LIGHT_SLEEP -> S_TO_DS (escalation) -->
<path d="M220,260 L220,230 L460,230 L460,216" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300" y="225" font-size="12" fill="#000000">sleep_req=DS (escalation)</text>

<!-- S_LIGHT_SLEEP -> S_WAKEUP_LS -->
<line x1="220" y1="316" x2="220" y2="360" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="226" y="342" font-size="12" fill="#000000">wakeup_req | ON</text>

<!-- S_DEEP_SLEEP -> S_WAKEUP_DS -->
<line x1="460" y1="316" x2="460" y2="360" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="466" y="342" font-size="12" fill="#000000">wakeup_req | ON</text>

<!-- S_WAKEUP_LS -> S_ON (feedback, left margin) -->
<path d="M140,388 L40,388 L40,88 L250,88" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="45" y="240" font-size="12" fill="#000000">timer=0 (after 3 cycles)</text>

<!-- S_WAKEUP_DS -> S_ON (feedback, right margin) -->
<path d="M540,388 L640,388 L640,88 L430,88" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="635" y="240" text-anchor="end" font-size="12" fill="#000000">timer=0 (after 8 cycles)</text>

<!-- Caption -->
<text x="340" y="455" text-anchor="middle" font-size="12" font-style="italic" fill="#000000">Self-transitions (remaining in the same state) omitted for clarity</text>

</svg>
